name: Frozen RG03 runtime readiness
description: Verify inputs, npm ci, official Chromium, service PG16 and native PG16 lifecycle capabilities
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node24 action
      with:
        node-version: '24.19.0'
        package-manager-cache: false
    - name: Verify exact frozen input integrity before provisioning
      shell: bash
      run: python3 ci/task.py frozen-input-integrity -- python3 ci/baseline.py verify
    - name: Refuse reruns that overwrite first-failure provenance
      shell: bash
      run: test "$GITHUB_RUN_ATTEMPT" = 1
    - name: Install project dependencies without changing the lockfile
      shell: bash
      run: |
        python3 ci/task.py npm-ci --cwd qalba-platform -- npm ci
        python3 - <<'PY'
        import os
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write('RG03_NPM_CI_COMPLETE=1\n')
        PY
    - name: Provision official signed native PostgreSQL 16 tooling
      shell: bash
      run: python3 ci/task.py native-postgres-provisioning -- bash ci/install-postgres.sh
    - name: Install the locked Playwright version's official Chromium and system dependencies
      shell: bash
      run: python3 ci/task.py official-chromium-install --cwd qalba-platform -- node node_modules/playwright/cli.js install --with-deps chromium
    - name: Prove every runtime-readiness condition before mandatory verification
      shell: bash
      run: python3 ci/task.py runtime-readiness -- node ci/readiness.mjs

