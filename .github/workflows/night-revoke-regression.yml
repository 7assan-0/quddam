name: Night invitation revocation and Shillatak regression (owner label only)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  isolated-regression:
    if: ${{ github.event.label.name == 'night-revoke-ci-approved' && github.event.pull_request.head.ref == 'feature/night-invite-revoke-on-shillatak-20261017' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:65432/prisma_generate_only
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: qalba-platform
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify immutable head
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          echo "NIGHT_SHILLA_TEST_SHA=$EXACT_HEAD"
      - name: Clean locked install and isolated code generation
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run db:generate
      - name: Owner-only revocation, Night and Shillatak unit regressions
        run: npx vitest run src/lib/night/invitation.test.ts src/app/api/night/invitation.route.test.ts src/lib/shillatak/rules.test.ts src/lib/shillatak/service.test.ts src/app/api/shillatak/route.test.ts --maxWorkers=1 --retry=0
      - name: Full unit inventory (no retries)
        run: npm run test -- --maxWorkers=1 --retry=0
      - name: TypeScript lint and production build
        run: |
          npm run typecheck
          npm run lint
          npm run build
