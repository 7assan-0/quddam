name: Unified Beta candidate Night Shillatak Room Board36 and UI (synthetic only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read

jobs:
  beta-integration:
    if: ${{ github.event.pull_request.head.ref == 'security/beta-unified-selector-20261017' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    concurrency:
      group: beta-integration-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quddam_beta_ci
          POSTGRES_PASSWORD: synthetic-only-integrated-ci-password
          POSTGRES_DB: night_mvp_beta_integrated_ci
        ports:
          - 55472:5432
        options: >-
          --health-cmd "pg_isready -U quddam_beta_ci -d night_mvp_beta_integrated_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: qalba-platform
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_POOL_MAX: '10'
      NIGHT_MVP_SYNTHETIC: '1'
      ENABLE_NIGHT_OF_QUDDAM: 'true'
      ENABLE_SHILLATAK: 'true'
      PUBLIC_WELCOME_CREDITS_ENABLED: 'false'
      AUTH_RATE_LIMIT_SECRET: synthetic-integrated-beta-ci-secret-0123456789abcdef
      AUTH_TRUST_PROXY: 'false'
      DATABASE_URL: postgresql://quddam_beta_ci:synthetic-only-integrated-ci-password@127.0.0.1:55472/night_mvp_beta_integrated_ci
      NIGHT_MVP_ENV_FILE: /tmp/quddam-beta-integration/database.private.json
      NIGHT_MVP_OUTPUT: /tmp/quddam-beta-integration
      BASE_URL: http://127.0.0.1:3000
      NIGHT_MVP_CHROME_NO_SANDBOX: '1'
      NIGHT_PHASE4_NATIVE_RUN: integrated-night-native
      BETA_NIGHT_RUN: integrated-night-chrome
      BETA_SHILLA_RUN: integrated-shilla-chrome
      BETA_SHILLATAK_CHROME_RUN: integrated-shilla-chrome
      BETA_SITE_RUN: integrated-room-chrome
      BETA_RESTART_RUN: integrated-restart
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Bind exact proposed integrated SHA and native PG17 empty database
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$(node -v)" = v24.19.0
          for env_name in .env .env.local .env.production .env.production.local; do test ! -e "$env_name"; done
          umask 077
          mkdir -p "$NIGHT_MVP_OUTPUT"
          chmod 700 "$NIGHT_MVP_OUTPUT"
          printf '{"DATABASE_URL":"%s"}\n' "$DATABASE_URL" > "$NIGHT_MVP_ENV_FILE"
          chmod 600 "$NIGHT_MVP_ENV_FILE"
          echo 'EXACT_SHA_AND_PRIVATE_FIXTURE_FILE_VERIFIED'
      - name: Clean lockfile install and generated Prisma client
        run: |
          npm ci --include=dev --no-audit --no-fund
          node <<'NODE'
          const {Client}=require('pg'); (async()=>{
            const c=new Client({connectionString:process.env.DATABASE_URL}); await c.connect();
            try { const {rows:[r]}=await c.query("SELECT current_database() AS name, current_setting('server_version_num')::int AS version, (SELECT count(*)::int FROM pg_tables WHERE schemaname='public') AS tables");
              if(r.name!=='night_mvp_beta_integrated_ci'||r.version<170000||r.version>=180000||r.tables!==0) throw Error('Not the new dedicated empty PostgreSQL17 fixture');
              console.log('EMPTY_NATIVE_POSTGRES17_VERIFIED');
            } finally { await c.end(); }
          })().catch(()=>{ console.error('Database identity verification failed'); process.exitCode=1; });
          NODE
          npm run db:generate
      - name: Verify literal source-binding from full Git object checkout BEFORE running suites
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if python3 ../ci/financial-review/source-binding.py "$GITHUB_WORKSPACE" "$EXACT_SHA" > "$NIGHT_MVP_OUTPUT/source-before.private.json" 2> "$NIGHT_MVP_OUTPUT/source-before.stderr.private.log"; then
            echo SOURCE_BINDING_PRE_SUITE_PASS
          else
            echo SOURCE_BINDING_PRE_SUITE_FAIL
            head -n 2 "$NIGHT_MVP_OUTPUT/source-before.stderr.private.log"
            exit 1
          fi
      - name: Full regression, TypeScript, lint, production build and strict Next-generated-file integrity
        env:
          APP_URL: http://localhost:3000
          BETA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run test -- --maxWorkers=1 --retry=0
          npm run typecheck
          npm run lint
          npm run build
          node scripts/beta-next-env-integrity.mjs
      - name: Apply original migrations and seed only guarded synthetic Beta + original Room bank
        run: |
          npm run db:migrate
          npm exec -- prisma migrate status
          node --import tsx scripts/night-mvp-fixtures.ts --seed
          node --import tsx scripts/beta-fixtures.ts --seed-beta
          node --import tsx scripts/night-phase4-fixtures.ts
          node --import tsx scripts/beta-site-fixtures.ts --bank
      - name: Native Shillatak group, Night canonical engines and revocation races on same PG17
        run: |
          BETA_NATIVE_RUN=integrated-shilla-native node --import tsx scripts/beta-shillatak-postgres.ts
          NIGHT_PHASE4_RUN=integrated-night-native node --import tsx scripts/night-phase4-postgres.ts
          node --import tsx scripts/night-revoke-pg17.ts
      - name: Install actual Google Chrome and verify executable identity
        run: |
          npx playwright install --with-deps chrome
          chrome="$(command -v google-chrome)"
          test -x "$chrome"
          "$chrome" --version | grep '^Google Chrome'
          echo "CHROME_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
      - name: Built app on loopback; real complete Night -> Shillatak -> 8-guest Room browser journeys
        env:
          APP_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$NIGHT_MVP_OUTPUT/integrated-next.private.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/login; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          NIGHT_PHASE4_RUN=integrated-night-chrome node scripts/night-phase4-chrome.mjs
          node scripts/beta-shillatak-chrome.mjs
          node scripts/beta-site-chrome.mjs
      - name: Repeat exact source binding AFTER full browser journeys; do not bypass inventory failures
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if python3 ../ci/financial-review/source-binding.py "$GITHUB_WORKSPACE" "$EXACT_SHA" > "$NIGHT_MVP_OUTPUT/source-after.private.json" 2> "$NIGHT_MVP_OUTPUT/source-after.stderr.private.log"; then
            echo SOURCE_BINDING_POST_BROWSER_PASS
          else
            echo SOURCE_BINDING_POST_BROWSER_FAIL
            head -n 2 "$NIGHT_MVP_OUTPUT/source-after.stderr.private.log"
            exit 1
          fi
      - name: Fresh built-process restart, owner authorization, flags and immutable state
        env:
          BETA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --import tsx scripts/beta-restart.ts
      - name: Re-open a revoked invite from three independent real Chrome contexts on same PG17
        env:
          BASE_URL: http://127.0.0.1:3100
          APP_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100 > "$NIGHT_MVP_OUTPUT/integrated-revocation-next.private.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3100/login; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          node scripts/night-revoke-browser.mjs
      - name: Read-only source-bound cross-surface DB and private-receipt consistency
        env:
          BETA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --import tsx scripts/beta-integrated-crosscheck.ts
      - name: Upload only de-identified counts and limitations; never evidence secrets or raw DB logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: integrated-beta-unified-candidate-${{ github.run_id }}
          path: /tmp/quddam-beta-integration/integrated-summary.json
          if-no-files-found: warn
          retention-days: 7

  board-36:
    if: ${{ github.event.pull_request.head.ref == 'security/beta-unified-selector-20261017' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: qalba-platform
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      # Prisma generation only: the browser runner creates its own in-memory fixture.
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:65432/never_connect
      E2E_REPORT_FILE: playwright-report/board-36.json
      E2E_WARMUP_GROUP: board
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Bind evidence to exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node -v)" = "v24.19.0"
          echo "CATEGORY_BOARD_36_SOURCE_SHA=$EXPECTED_SHA"
      - name: Locked dependency install and Prisma generation
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run db:generate
      - name: Full Vitest (including 36-cell completion and 72 authored source)
        run: npm run test -- --maxWorkers=1 --retry=0
      - name: TypeScript ESLint and build
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Install actual Chromium
        run: npx playwright install --with-deps chromium
      - name: Isolated seeded PGlite UI regression (no production data)
        run: |
          mkdir -p playwright-report
          npm run test:e2e:db -- tests/e2e/category-board-36.spec.ts tests/e2e/category-board.spec.ts tests/e2e/board-hardening.spec.ts tests/e2e/category-board-beta-journey.spec.ts --workers=1 --retries=0
      - name: Upload sanitized browser summary
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unified-board-36-${{ github.run_id }}
          path: qalba-platform/playwright-report/board-36.json
          if-no-files-found: warn
          retention-days: 7
