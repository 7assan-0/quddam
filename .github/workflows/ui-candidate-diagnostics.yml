name: Isolated UI candidate diagnostics (no deploy)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ui-candidate-diagnostics.yml'
permissions:
  contents: read
jobs:
  ui-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa_ui
          POSTGRES_PASSWORD: synthetic-only-qa-ui
          POSTGRES_DB: qa_ui
        ports:
          - 55469:5432
        options: >-
          --health-cmd "pg_isready -U qa_ui -d qa_ui"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://qa_ui:synthetic-only-qa-ui@127.0.0.1:55469/qa_ui
      APP_URL: https://quddam.test
      AUTH_RATE_LIMIT_SECRET: synthetic-ui-check-only-0123456789abcdef
      PUBLIC_WELCOME_CREDITS_ENABLED: 'false'
    defaults:
      run:
        working-directory: qalba-platform
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ceccd1a692c553f0acf97af5184eb22824ed0ba0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Assert exact UI source
        run: test "$(git rev-parse HEAD)" = "ceccd1a692c553f0acf97af5184eb22824ed0ba0"
      - name: Locked install and synthetic DB preparation
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run db:generate
          npm run db:migrate
          npm run db:seed:content
      - name: Full unit suite (visible diagnostics, no retry)
        id: unit
        run: npm run test -- --maxWorkers=1 --retry=0 --reporter=verbose
      - name: ESLint
        if: always()
        run: npm run lint
      - name: Generate route types
        if: always()
        run: node node_modules/next/dist/bin/next typegen
      - name: TypeScript check
        if: always()
        run: npm run typecheck
      - name: Production build (synthetic env)
        if: always()
        run: npm run build
