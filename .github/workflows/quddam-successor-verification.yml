name: Quddam successor source and quality verification

# Separate from the approved RG03 workflow. Never creates a release or deploys.
on:
  # Temporary PR #2-only registration; remove before final manual dispatch.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'ci/successor/**'
      - '.github/workflows/quddam-successor-verification.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Integrity preflight only, or fresh source-bound quality checks
        type: choice
        options: [verify, quality]
        default: verify

permissions:
  contents: read

concurrency:
  group: quddam-successor-2d4e868
  cancel-in-progress: false

jobs:
  successor:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.number == 2 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'codex/successor-candidate-verification')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          # Exact application source target; not the tooling/workflow commit.
          ref: 2d4e868ba43700414c19ece1394bf6815e7639cf
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test verifier rejection contracts
        run: python3 -B -m unittest discover -s tooling/ci/successor -p 'test_*.py' -v
      - name: Verify the exact successor source
        env:
          MODE: ${{ inputs.mode || 'verify' }}
        run: >-
          python3 -B tooling/ci/successor/verify.py "$MODE"
          --root candidate --output "$RUNNER_TEMP/successor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload source-bound summary, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: successor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/successor-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: warn
          retention-days: 14
