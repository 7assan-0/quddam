name: Staging preparation contract (synthetic only)

on:
  pull_request:
    paths:
      - 'qalba-platform/scripts/staging-preflight.mjs'
      - 'qalba-platform/scripts/staging-preflight.test.mjs'
      - 'qalba-platform/docs/staging-preparation.md'
      - '.github/workflows/staging-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Synthetic contract test only; no deployment or external services
        working-directory: qalba-platform
        run: node --test scripts/staging-preflight.test.mjs
