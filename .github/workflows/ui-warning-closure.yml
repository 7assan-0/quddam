name: UI warning closure exact-head regression (synthetic only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - ui/targeted-visual-fixes-20261017
    paths:
      - '.github/workflows/ui-warning-closure.yml'
      - 'qalba-platform/scripts/staging-arm64-pg17-ci.mjs'
      - 'qalba-platform/src/lib/shillatak/rules.test.ts'
permissions:
  contents: read
jobs:
  exact-head-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa_ui
          POSTGRES_PASSWORD: synthetic-only-qa-ui
          POSTGRES_DB: qa_ui
        ports:
          - 55469:5432
        options: >-
          --health-cmd "pg_isready -U qa_ui -d qa_ui"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://qa_ui:synthetic-only-qa-ui@127.0.0.1:55469/qa_ui
      APP_URL: https://quddam.test
      AUTH_RATE_LIMIT_SECRET: synthetic-ui-check-only-0123456789abcdef
      PUBLIC_WELCOME_CREDITS_ENABLED: 'false'
    defaults:
      run:
        working-directory: qalba-platform
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify the proposed PR exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Locked install and disposable PostgreSQL fixture
        run: |
          npm ci --include=dev --no-fund
          npm run db:generate
          npm run db:migrate
          npm run db:seed:content
      - name: Full Vitest without retries
        env:
          APP_URL: http://localhost:3000
        run: npm run test -- --maxWorkers=1 --retry=0
      - name: ESLint must have zero errors and warnings
        if: always()
        run: npm run lint -- --max-warnings=0
      - name: Next route type generation
        if: always()
        run: node node_modules/next/dist/bin/next typegen
      - name: TypeScript check
        if: always()
        run: npm run typecheck
      - name: Production build with synthetic values
        if: always()
        run: npm run build
