name: Board576 original editorial source and full regression (synthetic only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source-quality:
    if: ${{ github.event.pull_request.head.ref == 'content/board-576-original-curation-20261017' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: qalba-platform
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:65432/never_connect
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Bind exact proposed source and refuse local dotenv
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node -v)" = "v24.19.0"
          for name in .env .env.local .env.production .env.production.local; do test ! -e "$name"; done
          echo "BOARD_576_EXACT_SHA=$EXPECTED_SHA"
      - name: Clean lockfile install, Prisma generation
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run db:generate
      - name: Full existing regression plus new 576-category source/difficulty/duplication gates
        run: npm run test -- --maxWorkers=1 --retry=0
      - name: TypeScript lint and production build
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Verify exact tracked source inventory after full quality checks
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 ../ci/financial-review/source-binding.py "$GITHUB_WORKSPACE" "$EXPECTED_SHA" > /tmp/board-576-source-binding.private.json
          echo "BOARD_576_SOURCE_BINDING_PASS"
