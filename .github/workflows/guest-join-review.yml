name: Scoped guest-join admission review

on:
  pull_request:
    paths:
      - 'qalba-platform/src/lib/rooms/**'
      - 'qalba-platform/src/app/api/rooms/**'
      - 'qalba-platform/src/app/api/social/**'
      - 'qalba-platform/src/app/api/court/**'
      - 'qalba-platform/src/app/api/bluff/**'
      - 'qalba-platform/scripts/guest-join-postgres.ts'
      - '.github/workflows/guest-join-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # PostgreSQL 16.15
        env:
          POSTGRES_USER: join_admission_test
          POSTGRES_DB: join_admission_test
          POSTGRES_PASSWORD: join-test-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 55466:5432
        options: >-
          --health-cmd "pg_isready -U join_admission_test -d join_admission_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://join_admission_test:join-test-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:55466/join_admission_test
      DATABASE_POOL_MAX: '10'
      AUTH_RATE_LIMIT_SECRET: synthetic-only-guest-admission-hmac-secret-for-CI
      AUTH_TRUST_PROXY: 'true'
      AUTH_CLIENT_IP_HEADER: x-quddam-client-ip
      JOIN_TEST_DATABASE: '1'
      PUBLIC_WELCOME_CREDITS_ENABLED: 'false'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Assert exact source identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Frozen install, client generation and forward migration in disposable database
        working-directory: qalba-platform
        run: |
          npm ci
          npm run db:generate
          npm run db:migrate
      - name: Complete unit suite and native admission checks
        working-directory: qalba-platform
        run: |
          npm run test -- --maxWorkers=1 --retry=0
          node --import tsx scripts/guest-join-postgres.ts
      - name: Lint, route types, typecheck and production build
        working-directory: qalba-platform
        env:
          APP_URL: https://quddam.test
        run: |
          npm run lint
          node node_modules/next/dist/bin/next typegen
          npm run typecheck
          npm run build
