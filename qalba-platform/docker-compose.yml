services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qalba
      POSTGRES_USER: qalba
      POSTGRES_PASSWORD: qalba
    ports:
      - "5432:5432"
    volumes:
      - qalba_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalba -d qalba"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  qalba_pg:
